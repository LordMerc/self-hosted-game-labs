name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Click Deploy on Palworld\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Host operating system, Docker version, router model, and whether you use UPnP or manual port forwarding.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove passwords, tokens and your public IP first.
