# Works with plain `docker compose up -d --build` and with Git-based stack deploys (Dockhand, Portainer, ...).
# Every setting below can come from a .env file next to this file, or from the stack's environment variables.
services:
  gamelabs:
    build: .
    # Rebuild on every `up`, so a Git stack redeploy picks up new commits (the layer cache keeps it quick).
    pull_policy: build
    container_name: ${INSTANCE:-gamelabs}
    # Host networking is required: UPnP discovery (SSDP) does not cross the Docker bridge,
    # and game servers are exposed on the host's own ports.
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gamelabs-data:/data
      # Game and world data. The host path must equal the container path: the Docker daemon resolves bind mounts
      # on the host. Point GAME_DATA_DIR at another drive (for example /mnt/games) to keep game data off the system disk.
      - ${GAME_DATA_DIR:-/srv/gameservers}:${GAME_DATA_DIR:-/srv/gameservers}
    environment:
      PANEL_PORT: ${PANEL_PORT:-8090}
      PANEL_HOST: ${PANEL_HOST:-0.0.0.0}
      INSTANCE: ${INSTANCE:-gamelabs}
      GAMESERVERS_DIR: ${GAME_DATA_DIR:-/srv/gameservers}
      HOST_LAN_IP: ${HOST_LAN_IP:-}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      CONNECTIVITY: ${CONNECTIVITY:-manual}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE: ${CF_ZONE:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      PORT_CHECK: ${PORT_CHECK:-on}
      TZ: ${TZ:-UTC}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      UPDATE_CHECK: ${UPDATE_CHECK:-on}

volumes:
  gamelabs-data:
