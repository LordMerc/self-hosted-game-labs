# Verify image, ports and env names against the image's current docs before changing.
# https://github.com/thijsvanloef/palworld-server-docker
id: palworld
name: Palworld
image: thijsvanloef/palworld-server-docker:v2.8.0
# Pinned to the version that was current when the first world ran (2026-10): a new image can change settings or break saves,
# so the panel offers a newer version tag as an update instead of taking it silently.
versionPattern: "^v\\d+\\.\\d+\\.\\d+$"
accent: "#4ade80"
artwork: https://cdn.cloudflare.steamstatic.com/steam/apps/1623730/library_hero.jpg
artworkCredit: "Steam store art for Palworld, © Pocketpair. Shown as the game's store picture, not under an open license"
maxPlayers: 32
join:
  method: direct
ports:
  - name: game
    default: 8211
    protocol: udp
    env: PORT
  - name: query
    default: 27015
    protocol: udp
    env: QUERY_PORT
    # Not `query: a2s`: Palworld opens this port but never answers on it (its receive queue fills and drops every packet),
    # so the player count comes from the game's REST API instead, below.
env:
  SERVER_NAME:
    label: Server name
    default: Palworld Server
  SERVER_PASSWORD:
    label: Server password
    secret: true
    help: Leave empty for a password-free server.
  ADMIN_PASSWORD:
    label: Admin password
    secret: true
    generate: true
    help: Used for in-game admin commands and RCON.
# The image turns the REST API on by default, with the admin password. Asked from inside the container, so port 8212 is never published.
playerCount:
  exec: [sh, -c, 'curl -fsS -m 3 -u "admin:$ADMIN_PASSWORD" "http://127.0.0.1:${REST_API_PORT:-8212}/v1/api/metrics"']
  format: palworld-rest
# The image ships with RCON off, so the panel turns it on. RCON_PORT is the image's default; it is not in `ports`, so it is never published to the host.
fixedEnv:
  RCON_ENABLED: "true"
  RCON_PORT: "25575"
# The image ships `rcon-cli`, which talks to the server's own RCON using ADMIN_PASSWORD.
console:
  exec: [rcon-cli]
  offNotice: This server was made before the panel turned on RCON, so the console cannot reach the game yet. Apply settings recreates the container with RCON on; your world is kept.
  examples: [ShowPlayers, Save, Broadcast Server_restarting_soon, Info]
  broadcast:
    command: "Broadcast ${MESSAGE}"
    spaceChar: "_"
data:
  - containerPath: /palworld
