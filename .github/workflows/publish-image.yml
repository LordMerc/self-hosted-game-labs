# Builds the panel image and publishes it to GitHub Container Registry (ghcr.io/lordmerc/self-hosted-game-labs).
# No secrets to set up: it uses the repository's built-in GITHUB_TOKEN.
# Images change only when you release (or push to the beta branch). Nothing else publishes.
#   tag v1.2.3      -> :1.2.3, :1.2 and :latest (and :sha-<short commit>). :latest is the newest release.
#                      A pre-release tag such as v1.3.0-rc1 gets its own tag and does not move :latest.
#   push to beta    -> :beta and :sha-<short commit> (a preview image; see "Trying changes before a release" in the README)
#   push to main    -> builds for both platforms to prove the Dockerfile works, but publishes nothing
#   pull request    -> same: build only, publishes nothing
name: Publish image
on:
  push:
    branches: [main, beta]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Release builds report their version (v1.2.3); every other build says dev-<commit>, so the in-app
          # "new version available" notice does not compare a development build with a release.
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
          provenance: false
