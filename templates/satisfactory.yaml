# Verify image, ports and env names against the image's current docs before changing.
# https://github.com/wolveix/satisfactory-server  (image: wolveix/satisfactory-server)
id: satisfactory
name: Satisfactory
image: wolveix/satisfactory-server:latest
maxPlayers: 4
notes: Needs about 8 GB of free memory, and the first start downloads about 8 GB of game files, which can take a long time. It shows Starting until it is ready. When it is, open Satisfactory, go to Server Manager and add this server to claim it and set the admin password.
resources:
  minMemoryMb: 8192
join:
  method: direct
ports:
  - name: game
    default: 7777
    protocol: udp
    env: SERVERGAMEPORT
  - name: game-tcp
    default: 7777
    protocol: tcp
    env: SERVERGAMEPORT
  - name: messaging
    default: 8888
    protocol: tcp
    env: SERVERMESSAGINGPORT
env:
  MAXPLAYERS:
    label: Most players at once
    default: "4"
    pattern: "[0-9]{1,3}"
    patternMessage: must be a number
  STEAMBETA:
    label: Experimental version
    default: "false"
    choices: ["false", "true"]
    help: Run the experimental branch of the game. Players must use the same branch.
data:
  - containerPath: /config
    # The image starts as root and runs the game as 1000:1000.
    owner: { uid: 1000, gid: 1000 }
# The game files are re-downloaded by the server; backups keep the saves, blueprints and settings.
backup:
  exclude: [gamefiles, logs, backups]
